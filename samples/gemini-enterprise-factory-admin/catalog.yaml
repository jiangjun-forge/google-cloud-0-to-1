version: "1.0.0"
description: "Gemini Enterprise app 엔터프라이즈 어드민 거버넌스 및 관리 과제 카탈로그"
admin_tasks:
  # ==========================================
  # 1. 에이전트 & 스킬 스프롤 거버넌스 (Sprawl Governance)
  # ==========================================
  - slug: "sprawl-ghost-agent-triage"
    name: "60일 미사용 좀비 에이전트 전수 식별 및 보관 정리"
    category: "에이전트 스프롤 거버넌스"
    description: "임직원이 생성 후 방치한 수백 개 에이전트 중 60일 이상 호출 0건인 좀비 에이전트와 테스트용 임시 에이전트를 전수 식별하고 보관(Archive) 또는 폐기 대상을 추출한다."
    primary_action: "60일 미호출 에이전트 필터링 및 일괄 보관 조치 쿼리 생성"
    remediation_type: "BIGQUERY_AUDIT_AND_ARCHIVE"
    default_scope: "ORG"

  - slug: "sprawl-unapproved-skill-audit"
    name: "미승인 스킬 및 외부 엔드포인트 도구 감사"
    category: "에이전트 스프롤 거버넌스"
    description: "사내 승인 화이트리스트에 없는 외부 웹훅, 미승인 도메인, 사설 REST API를 호출하는 임직원 임의 등록 스킬(Extensions 및 MCP 도구)을 전수 탐지하고 비활성화한다."
    primary_action: "미인가 도구 호출 스킬 감사 및 비인가 엔드포인트 차단"
    remediation_type: "SKILL_MANIFEST_AUDIT"
    default_scope: "ORG"

  - slug: "sprawl-agent-lifecycle-enforcer"
    name: "퇴사자 및 부서 이동자 고아 에이전트 소유권 회수 및 이관"
    category: "에이전트 스프롤 거버넌스"
    description: "에이전트 생성자의 퇴사나 부서 이동으로 방치된 고아(Orphan) 에이전트를 감지하고, 부서 관리자나 중앙 서비스 계정으로 소유권을 재할당하는 생명주기 거버넌스를 처방한다."
    primary_action: "비활성 계정 소유 에이전트 탐지 및 소유권 재지정 매니페스트 생성"
    remediation_type: "LIFECYCLE_OWNERSHIP_TRANSFER"
    default_scope: "ORG"

  # ==========================================
  # 2. 사용량 및 텔레메트리 패턴 분석 (Usage & Telemetry)
  # ==========================================
  - slug: "telemetry-token-top10-ranking"
    name: "부서별 계정별 토큰 소비량 톱 10 및 비용 급증 추적"
    category: "사용량 및 텔레메트리 분석"
    description: "복잡한 Cloud Logging 필터링 없이 BigQuery 감사 로그로 부서별, 임직원 계정별, 에이전트별 토큰 소비량 랭킹과 전주 대비 급증 패턴을 즉시 분석한다."
    primary_action: "토큰 과소비 톱 10 계정 및 이상 급증 에이전트 집계 쿼리 실행"
    remediation_type: "BIGQUERY_SQL_TELEMETRY"
    default_scope: "ORG"

  - slug: "telemetry-quota-exhaustion-tracer"
    name: "429 할당량 고갈 에이전트 및 호출 집중 시간대 역추적"
    category: "사용량 및 텔레메트리 분석"
    description: "일일 풀링 쿼터 초과나 429 RESOURCE_EXHAUSTED 쓰로틀링 에러가 반복 발생하는 특정 에이전트와 피크 시간대 호출 트래픽 패턴을 역추적하고 쿼터 증설 및 속도 제한 가이드를 도출한다."
    primary_action: "429 에러 발생 시점 및 특정 에이전트 호출 패턴 역추적 쿼리 도출"
    remediation_type: "QUOTA_EXHAUSTION_DIAGNOSTIC"
    default_scope: "ORG"

  - slug: "telemetry-adoption-license-audit"
    name: "부서별 활성 사용자 추이 및 30일 미사용 유휴 계정 분석"
    category: "사용량 및 텔레메트리 분석"
    description: "BigQuery 감사 로그로 Gemini Enterprise app 활성 사용자(DAU/MAU)를 집계하고 30일 이상 호출 이력이 없는 미사용 계정을 식별한다."
    primary_action: "30일 이상 미호출 계정 및 부서별 활용률 집계 BigQuery SQL 생성"
    remediation_type: "BIGQUERY_SQL_TELEMETRY"
    default_scope: "ORG"

  # ==========================================
  # 3. GE 앱 운영 및 일괄 제어 (GE App Lifecycle & Operations)
  # ==========================================
  - slug: "ops-audit-logsink-setup"
    name: "Cloud Logging 감사 로그 BigQuery 자동 적재 싱크 구축"
    category: "GE 앱 운영 및 일괄 제어"
    description: "Discovery Engine 감사 로그를 BigQuery 전용 데이터셋으로 자동 라우팅하는 로그 싱크 및 권한 바인딩 절차를 구성한다."
    primary_action: "BigQuery 데이터셋 생성 및 Cloud Logging 로그 라우터 싱크 스크립트 생성"
    remediation_type: "CLOUD_LOGGING_SINK_SETUP"
    default_scope: "ORG"

  - slug: "ops-batch-state-cleanup"
    name: "사내 갤러리 테스트 에이전트 일괄 비활성화 및 공유 범위 정리"
    category: "GE 앱 운영 및 일괄 제어"
    description: "사내 갤러리(/r/agents)에 누적된 테스트 또는 임시 에이전트를 키워드로 선별해 상태를 일괄 비활성화(DISABLED)하고 공유 범위(ALL_USERS/PRIVATE)를 조정한다."
    primary_action: "대상 에이전트 선별 조회 및 배치 상태/공유 범위 변경 가이드 생성"
    remediation_type: "AGENT_BATCH_CONTROL"
    default_scope: "ORG"

  - slug: "ops-console-deeplink-guide"
    name: "Gemini Enterprise, 데이터 커넥터 및 Agent Platform 관리 콘솔 딥링크"
    category: "GE 앱 운영 및 일괄 제어"
    description: "복잡한 콘솔 메뉴 탐색 없이 GE App 에이전트 목록, 데이터 저장소(Data Stores), Agent Platform 런타임, BigQuery 관리 화면으로 즉시 이동한다."
    primary_action: "대상 프로젝트 및 GE App 기준 관리 콘솔 직접 딥링크 생성"
    remediation_type: "CONSOLE_NAVIGATION_GUIDE"
    default_scope: "ORG"
