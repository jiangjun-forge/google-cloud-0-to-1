version: "1.0.0"
description: "Gemini Enterprise app 엔터프라이즈 공식 스킬 카탈로그"
skills:
  # ==========================================
  # 1. 전자결재 및 품의 (Approval & Workflow)
  # ==========================================
  - slug: "approval-draft-create"
    name: "전자결재 기안문 초안 작성"
    category: "전자결재 및 품의"
    description: "사내 표준 기안 양식에 맞추어 품의 제목, 추진 배경, 예산 내역, 기대 효과를 구조화하여 결재선에 상신할 초안 문서를 자동 생성한다."
    access_mode: "mutation"
    slash_command: "/approval-draft-create"
    mention_handle: "@approval-draft-create"
    endpoint: "https://approval.corp.internal/api/v1/drafts/create"
    http_method: "POST"
    secret_key: "GROUPWARE_API_SECRET"
    default_scope: "ORG"
    required_params:
      - name: "doc_type"
        type: "string"
        description: "기안 양식 구분 (품의서, 지출결의서, 업무보고서)"
      - name: "title"
        type: "string"
        description: "기안 제목"
      - name: "body"
        type: "string"
        description: "기안 내용 및 추진 사유"

  - slug: "approval-status-check"
    name: "결재선 진행 상태 미결함 조회"
    category: "전자결재 및 품의"
    description: "본인이 상신한 결재 문서의 현재 진행 상태(대기, 검토, 전결)와 부서장/임원 결재 대기자 병목을 실시간 조회한다."
    access_mode: "read_only"
    slash_command: "/approval-status-check"
    mention_handle: "@approval-status-check"
    endpoint: "https://approval.corp.internal/api/v1/drafts/{doc_id}/status"
    http_method: "GET"
    secret_key: "GROUPWARE_API_SECRET"
    default_scope: "ORG"
    required_params:
      - name: "doc_id"
        type: "string"
        description: "조회할 전자결재 문서 번호"

  - slug: "approval-proxy-delegate"
    name: "전결 부재 시 대결자 지정"
    category: "전자결재 및 품의"
    description: "출장, 병가, 연차 휴가 등 부재 시 결재선 정체를 방지하기 위해 지정된 팀원에게 전결/대결 권한을 일시 위임한다."
    access_mode: "mutation"
    slash_command: "/approval-proxy-delegate"
    mention_handle: "@approval-proxy-delegate"
    endpoint: "https://approval.corp.internal/api/v1/delegations"
    http_method: "POST"
    secret_key: "GROUPWARE_API_SECRET"
    default_scope: "ORG"
    required_params:
      - name: "delegate_emp_id"
        type: "string"
        description: "대결자 사번"
      - name: "start_date"
        type: "string"
        description: "위임 시작일 (YYYY-MM-DD)"
      - name: "end_date"
        type: "string"
        description: "위임 종료일 (YYYY-MM-DD)"

  # ==========================================
  # 2. 법인카드 및 경비 정산 (Expense & Finance)
  # ==========================================
  - slug: "corp-card-reconcile"
    name: "법인카드 영수증 내역 자동 대조"
    category: "법인카드 및 경비 정산"
    description: "사내 법인카드 승인 내역과 모바일 영수증을 자동 대조하고 지출 계정 과목 및 세무 증빙 전표를 생성한다."
    access_mode: "mutation"
    slash_command: "/corp-card-reconcile"
    mention_handle: "@corp-card-reconcile"
    endpoint: "https://expense.corp.internal/api/v1/cards/reconcile"
    http_method: "POST"
    secret_key: "ERP_INTEGRATION_TOKEN"
    default_scope: "ORG"
    required_params:
      - name: "approval_no"
        type: "string"
        description: "카드 승인 번호 8자리"
      - name: "expense_purpose"
        type: "string"
        description: "사용 목적 및 상세 사유"

  - slug: "overtime-transport-claim"
    name: "야근 교통비 식대 정산 신청"
    category: "법인카드 및 경비 정산"
    description: "사내 규정 시간 이후 발생한 야근 택시비 영수증과 석식대를 주 52시간 근태 기록과 대조 검증 후 자동 품의한다."
    access_mode: "mutation"
    slash_command: "/overtime-transport-claim"
    mention_handle: "@overtime-transport-claim"
    endpoint: "https://expense.corp.internal/api/v1/claims/overtime"
    http_method: "POST"
    secret_key: "ERP_INTEGRATION_TOKEN"
    default_scope: "ORG"
    required_params:
      - name: "claim_date"
        type: "string"
        description: "근무 일자 (YYYY-MM-DD)"
      - name: "transport_amount"
        type: "number"
        description: "교통비 금액 (KRW)"
      - name: "meal_amount"
        type: "number"
        description: "야근 식대 금액 (KRW)"

  - slug: "biz-entertain-preapprove"
    name: "접대비 사전 품의서 제출"
    category: "법인카드 및 경비 정산"
    description: "청탁금지법 가이드라인 및 사내 1인당 접대 한도를 사전 점검하고 외부 이해관계자 미팅 식사 접대비 품의를 신청한다."
    access_mode: "mutation"
    slash_command: "/biz-entertain-preapprove"
    mention_handle: "@biz-entertain-preapprove"
    endpoint: "https://expense.corp.internal/api/v1/preapprovals/entertainment"
    http_method: "POST"
    secret_key: "ERP_INTEGRATION_TOKEN"
    default_scope: "ORG"
    required_params:
      - name: "external_org"
        type: "string"
        description: "대상 거래처명 또는 공공기관명"
      - name: "attendee_count"
        type: "integer"
        description: "총 참석 인원수"
      - name: "budget_limit"
        type: "number"
        description: "예상 지출 총액 (KRW)"

  - slug: "tax-invoice-verify"
    name: "홈택스 전자세금계산서 진위 확인"
    category: "법인카드 및 경비 정산"
    description: "국세청 홈택스 승인 번호 24자리와 공급자 사업자등록번호를 대조하여 세금계산서의 진위 및 정상 발급 여부를 실시간 검증한다."
    access_mode: "read_only"
    slash_command: "/tax-invoice-verify"
    mention_handle: "@tax-invoice-verify"
    endpoint: "https://hometax-gateway.corp.internal/api/v1/invoices/verify"
    http_method: "POST"
    secret_key: "HOMETAX_API_CERT_SECRET"
    default_scope: "ORG"
    required_params:
      - name: "tax_invoice_no"
        type: "string"
        description: "전자세금계산서 24자리 승인 번호"
      - name: "biz_reg_no"
        type: "string"
        description: "공급자 사업자등록번호 10자리"

  # ==========================================
  # 3. 근태 및 주 52시간 관리 (HR & Attendance)
  # ==========================================
  - slug: "hr-vacation-apply"
    name: "연차 반차 경조휴가 신청"
    category: "근태 및 주 52시간 관리"
    description: "사내 근태 시스템에서 잔여 연차를 확인하고 전일, 반차, 반반차 또는 경조 휴가를 신청하여 부서 캘린더에 연동한다."
    access_mode: "mutation"
    slash_command: "/hr-vacation-apply"
    mention_handle: "@hr-vacation-apply"
    endpoint: "https://hr.corp.internal/api/v1/leaves/apply"
    http_method: "POST"
    secret_key: "HR_SYSTEM_TOKEN"
    default_scope: "ORG"
    required_params:
      - name: "leave_type"
        type: "string"
        description: "휴가 종류 (연차, 오전반차, 오후반차, 경조휴가)"
      - name: "start_date"
        type: "string"
        description: "휴가 시작일 (YYYY-MM-DD)"
      - name: "days"
        type: "number"
        description: "차감 일수 (0.25, 0.5, 1.0 등)"

  - slug: "work-hours-monitor"
    name: "주 52시간 잔여 근무 시간 조회"
    category: "근태 및 주 52시간 관리"
    description: "당해 주의 기본 근로 및 연장 근로 누적 시간을 조회하여 주 52시간 법정 한도 초과 위험을 사전에 모니터링한다."
    access_mode: "read_only"
    slash_command: "/work-hours-monitor"
    mention_handle: "@work-hours-monitor"
    endpoint: "https://hr.corp.internal/api/v1/attendance/weekly-hours"
    http_method: "GET"
    secret_key: "HR_SYSTEM_TOKEN"
    default_scope: "ORG"
    required_params:
      - name: "emp_id"
        type: "string"
        description: "임직원 사번 (미지정 시 본인 세션)"

  - slug: "corp-directory-search"
    name: "사내 조직도 직급 사번 호칭 검색"
    category: "근태 및 주 52시간 관리"
    description: "사내 조직도 및 그룹웨어 주소록에서 특정 직원의 소속 본부/팀, 직급/직책, 자리 위치, 사내 내선 번호 및 업무 분장을 검색한다."
    access_mode: "read_only"
    slash_command: "/corp-directory-search"
    mention_handle: "@corp-directory-search"
    endpoint: "https://hr.corp.internal/api/v1/directory/search"
    http_method: "GET"
    secret_key: "HR_SYSTEM_TOKEN"
    default_scope: "ORG"
    required_params:
      - name: "keyword"
        type: "string"
        description: "검색할 직원 이름, 직급, 부서명 또는 담당 업무"

  - slug: "welfare-point-check"
    name: "사내 복지포인트 잔액 사용 조회"
    category: "근태 및 주 52시간 관리"
    description: "당해 연도 배정된 사내 복지포인트 총액, 기사용액, 잔여 포인트 및 복지몰/카페테리아 차감 가능 내역을 조회한다."
    access_mode: "read_only"
    slash_command: "/welfare-point-check"
    mention_handle: "@welfare-point-check"
    endpoint: "https://welfare.corp.internal/api/v1/points/balance"
    http_method: "GET"
    secret_key: "WELFARE_API_TOKEN"
    default_scope: "ORG"
    required_params:
      - name: "emp_id"
        type: "string"
        description: "임직원 사번"

  # ==========================================
  # 4. 총무 및 시설 자산 관리 (General Affairs & Facilities)
  # ==========================================
  - slug: "room-booking-reserve"
    name: "사내 회의실 화상 장비 예약"
    category: "총무 및 시설 자산 관리"
    description: "참석 인원수, 빔프로젝터, 화상 회의 장비(Meet/Zoom Room) 구비 여부에 맞추어 최적의 사내 회의실을 즉시 예약한다."
    access_mode: "mutation"
    slash_command: "/room-booking-reserve"
    mention_handle: "@room-booking-reserve"
    endpoint: "https://facilities.corp.internal/api/v1/rooms/book"
    http_method: "POST"
    secret_key: "FACILITIES_API_SECRET"
    default_scope: "ORG"
    required_params:
      - name: "start_time"
        type: "string"
        description: "회의 시작 일시 (YYYY-MM-DD HH:MM)"
      - name: "capacity"
        type: "integer"
        description: "참석 인원수"
      - name: "needs_video"
        type: "boolean"
        description: "화상 회의 장비 필요 여부"

  - slug: "corp-car-dispatch"
    name: "업무용 법인 차량 배차 신청"
    category: "총무 및 시설 자산 관리"
    description: "고객사 미팅 및 지방 출장용 업무용 법인 차량 배차를 신청하고 하이패스 및 운행 일지 작성을 자동 연동한다."
    access_mode: "mutation"
    slash_command: "/corp-car-dispatch"
    mention_handle: "@corp-car-dispatch"
    endpoint: "https://facilities.corp.internal/api/v1/cars/dispatch"
    http_method: "POST"
    secret_key: "FACILITIES_API_SECRET"
    default_scope: "ORG"
    required_params:
      - name: "destination"
        type: "string"
        description: "출장 목적지"
      - name: "purpose"
        type: "string"
        description: "외근 사유"
      - name: "departure_time"
        type: "string"
        description: "출발 예정 시각 (YYYY-MM-DD HH:MM)"

  - slug: "it-asset-request"
    name: "업무용 PC 모니터 전산 비품 신청"
    category: "총무 및 시설 자산 관리"
    description: "개발자용 고사양 노트북(MacBook/ThinkPad), 4K 모니터, 키보드/마우스 등 전산 장비 지급 및 교체 신청을 상신한다."
    access_mode: "mutation"
    slash_command: "/it-asset-request"
    mention_handle: "@it-asset-request"
    endpoint: "https://it-service.corp.internal/api/v1/assets/request"
    http_method: "POST"
    secret_key: "ITSM_SERVICE_TOKEN"
    default_scope: "ORG"
    required_params:
      - name: "asset_category"
        type: "string"
        description: "요청 품목 (노트북, 모니터, 전산주변기기)"
      - name: "specs"
        type: "string"
        description: "희망 사양 및 신청 사유"

  - slug: "sw-license-grant"
    name: "사내 소프트웨어 라이선스 신청"
    category: "총무 및 시설 자산 관리"
    description: "JetBrains All Products Pack, Adobe Creative Cloud, Figma 등 유료 업무 소프트웨어의 사내 라이선스 자동 배정을 신청한다."
    access_mode: "mutation"
    slash_command: "/sw-license-grant"
    mention_handle: "@sw-license-grant"
    endpoint: "https://it-service.corp.internal/api/v1/licenses/grant"
    http_method: "POST"
    secret_key: "ITSM_SERVICE_TOKEN"
    default_scope: "ORG"
    required_params:
      - name: "software_name"
        type: "string"
        description: "소프트웨어 명칭 (JetBrains, Adobe, Figma 등)"
      - name: "business_need"
        type: "string"
        description: "업무 필요 사유"

  # ==========================================
  # 5. 사내 정보보안 및 망 분리 (Security & Compliance)
  # ==========================================
  - slug: "doc-export-approval"
    name: "사내 문서 외부 반출 승인 요청"
    category: "사내 정보보안 및 망 분리"
    description: "망 분리 환경에서 사내 대외비 문서의 외부 반출(DRM 해제, 외부 메일 발송, USB 복사)을 위한 보안성 검토 및 승인을 요청한다."
    access_mode: "mutation"
    slash_command: "/doc-export-approval"
    mention_handle: "@doc-export-approval"
    endpoint: "https://security.corp.internal/api/v1/exports/request"
    http_method: "POST"
    secret_key: "SECURITY_PORTAL_TOKEN"
    default_scope: "ORG"
    required_params:
      - name: "file_name"
        type: "string"
        description: "반출 대상 파일명"
      - name: "recipient_org"
        type: "string"
        description: "외부 수신 기관/업체명"
      - name: "security_level"
        type: "string"
        description: "문서 보안 등급 (일반, 대외비, 기밀)"

  - slug: "firewall-open-request"
    name: "사내망 임시 IP 방화벽 오픈 신청"
    category: "사내 정보보안 및 망 분리"
    description: "개발 및 테스트 서버에서 외부 SaaS 또는 협력사 API 연동을 위해 필요한 특정 IP와 포트의 임시 방화벽 오픈을 신청한다."
    access_mode: "mutation"
    slash_command: "/firewall-open-request"
    mention_handle: "@firewall-open-request"
    endpoint: "https://security.corp.internal/api/v1/firewall/requests"
    http_method: "POST"
    secret_key: "SECURITY_PORTAL_TOKEN"
    default_scope: "ORG"
    required_params:
      - name: "target_ip"
        type: "string"
        description: "대상 목적지 IP 또는 대역"
      - name: "target_port"
        type: "integer"
        description: "허용 대상 포트 번호 (예: 443)"
      - name: "duration_days"
        type: "integer"
        description: "신청 유효 기간 (일 단위)"

  - slug: "pii-access-permit"
    name: "고객 개인정보 열람 사유 결재"
    category: "사내 정보보안 및 망 분리"
    description: "고객 지원, 장애 분석 또는 환불 처리를 위해 고객 개인식별정보(PII) 마스킹 해제 및 데이터베이스 열람 사유서를 상신한다."
    access_mode: "mutation"
    slash_command: "/pii-access-permit"
    mention_handle: "@pii-access-permit"
    endpoint: "https://security.corp.internal/api/v1/pii/permit"
    http_method: "POST"
    secret_key: "SECURITY_PORTAL_TOKEN"
    default_scope: "ORG"
    required_params:
      - name: "customer_id"
        type: "string"
        description: "열람 대상 고객 식별자"
      - name: "purpose"
        type: "string"
        description: "열람 목적 및 근거 티켓 번호"

  # ==========================================
  # 6. 업무 협업 및 워크스페이스 (Collaboration & Workspace)
  # ==========================================
  - slug: "slack-notice-broadcast"
    name: "사내 메신저 공지 긴급 알림 배포"
    category: "업무 협업 및 워크스페이스"
    description: "사내 슬랙(Slack), 잔디(Jandi) 또는 카카오워크 특정 전사/부서 채널에 긴급 공지, 인사이동, 경조사 알림을 발송한다."
    access_mode: "mutation"
    slash_command: "/slack-notice-broadcast"
    mention_handle: "@slack-notice-broadcast"
    endpoint: "https://slack.com/api/chat.postMessage"
    http_method: "POST"
    secret_key: "SLACK_BOT_TOKEN"
    default_scope: "ORG"
    required_params:
      - name: "channel"
        type: "string"
