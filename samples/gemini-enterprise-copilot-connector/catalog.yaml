version: "2.0.0"
description: "Gemini Enterprise app 14대 엔터프라이즈 3P SaaS 데이터 커넥터 카탈로그"
connectors:
  - slug: "collab-confluence-wiki"
    name: "Confluence Cloud 사내 지식 베이스 커넥터"
    category: "협업 도구 및 기술 문서"
    source_type: "CONFLUENCE"
    auth_type: "OAUTH2_CLIENT_CREDENTIALS"
    required_secret_keys:
      - "confluence_client_id"
      - "confluence_client_secret"
      - "confluence_space_keys"
    sync_mode: "HOURLY_INCREMENTAL"
    acl_mode: "SPACE_AND_PAGE_RESTRICTIONS"
    description: "사내 기술 문서, 운영 가이드, 부서별 위키 스페이스를 색인하고 페이지별 접근 제한 권한을 실시간 동기화한다."
    content_types:
      - "pages"
      - "blogposts"
      - "attachments"
    default_scope: "ORG"

  - slug: "itsm-jira-issue"
    name: "Jira Cloud 엔터프라이즈 이슈 트래커 커넥터"
    category: "프로젝트 및 이슈 관리"
    source_type: "JIRA"
    auth_type: "OAUTH2_CLIENT_CREDENTIALS"
    required_secret_keys:
      - "jira_client_id"
      - "jira_client_secret"
      - "jira_instance_url"
    sync_mode: "HOURLY_INCREMENTAL"
    acl_mode: "IDENTITY_MAPPING_OIDC"
    description: "사내 개발 및 운영 지라(Jira) 프로젝트 티켓, 이슈 내역, 에픽 및 댓글 데이터를 색인하고 이슈 보안 스킴(Security Scheme)을 동기화한다."
    content_types:
      - "issues"
      - "comments"
      - "attachments"
    default_scope: "ORG"

  - slug: "collab-sharepoint-site"
    name: "Microsoft SharePoint Online 팀 사이트 커넥터"
    category: "엔터프라이즈 콘텐츠 관리"
    source_type: "SHAREPOINT"
    auth_type: "MICROSOFT_ENTRA_ID_OAUTH2"
    required_secret_keys:
      - "sharepoint_tenant_id"
      - "sharepoint_client_id"
      - "sharepoint_client_secret"
    sync_mode: "HOURLY_INCREMENTAL"
    acl_mode: "ENTRA_ID_USER_AND_GROUP_ACLS"
    description: "SharePoint Online 팀 사이트 문서 라이브러리(DOCX, PPTX, PDF) 및 웹 파트 콘텐츠를 Microsoft Entra ID 그룹 ACL과 연동하여 색인한다."
    content_types:
      - "documents"
      - "list_items"
      - "pages"
    default_scope: "ORG"

  - slug: "collab-onedrive-biz"
    name: "Microsoft OneDrive for Business 기업 문서 커넥터"
    category: "엔터프라이즈 콘텐츠 관리"
    source_type: "ONEDRIVE"
    auth_type: "MICROSOFT_ENTRA_ID_OAUTH2"
    required_secret_keys:
      - "onedrive_tenant_id"
      - "onedrive_client_id"
      - "onedrive_client_secret"
    sync_mode: "HOURLY_INCREMENTAL"
    acl_mode: "USER_DRIVE_PERMISSION_MAPPING"
    description: "OneDrive for Business 내 업무 문서 및 공유 폴더를 색인하고 개인별/그룹별 파일 공유 권한을 실시간 매핑한다."
    content_types:
      - "files"
      - "shared_folders"
    default_scope: "ORG"

  - slug: "crm-salesforce-lead"
    name: "Salesforce CRM 고객 및 영업 기회 커넥터"
    category: "고객 관계 관리 (CRM)"
    source_type: "SALESFORCE"
    auth_type: "OAUTH2_JWT_BEARER"
    required_secret_keys:
      - "salesforce_client_id"
      - "salesforce_private_key"
      - "salesforce_domain"
    sync_mode: "DAILY_BATCH"
    acl_mode: "ROLE_HIERARCHY_AND_SHARING_RULES"
    description: "고객 계정(Account), 영업 기회(Opportunity), 담당자(Contact) 및 지원 케이스 데이터를 동기화하고 Salesforce 역할 계층 공유 규칙을 적용한다."
    content_types:
      - "Account"
      - "Opportunity"
      - "Contact"
      - "Case"
    default_scope: "ORG"

  - slug: "itsm-servicenow-ticket"
    name: "ServiceNow ITSM 인시던트 및 서비스 요청 커넥터"
    category: "IT 서비스 관리 (ITSM)"
    source_type: "SERVICENOW"
    auth_type: "OAUTH2_AUTHORIZATION_CODE"
    required_secret_keys:
      - "servicenow_instance_id"
      - "servicenow_client_id"
      - "servicenow_client_secret"
    sync_mode: "HOURLY_INCREMENTAL"
    acl_mode: "GROUP_AND_ROLE_BASED_ACCESS"
    description: "사내 IT 장애 티켓, 서비스 요청 카탈로그, 변경 요청서(RFC) 및 CMDB 자산 정보를 역할 기반 접근 권한에 맞추어 색인한다."
    content_types:
      - "incident"
      - "change_request"
      - "problem"
      - "cmdb_ci"
    default_scope: "ORG"

  - slug: "hrms-workday-core"
    name: "Workday 인사 조직도 및 인재 관리 커넥터"
    category: "인사 및 조직 관리 (HRMS)"
    source_type: "WORKDAY_RAAS"
    auth_type: "OAUTH2_WORKDAY_ISU"
    required_secret_keys:
      - "workday_tenant_url"
      - "workday_client_id"
      - "workday_refresh_token"
    sync_mode: "HOURLY_INCREMENTAL"
    acl_mode: "MANAGEMENT_CHAIN_SUPERVISORY_ORG"
    description: "전사 임직원 조직도, 부서 배정, 직무 프로필 및 사내 디렉터리 정보를 Workday RaaS 엔드포인트로부터 안전하게 색인한다."
    content_types:
      - "Worker"
      - "SupervisoryOrganization"
      - "JobProfile"
    default_scope: "ORG"

  - slug: "erp-sap-hana"
    name: "SAP S/4HANA ERP 마스터 데이터 및 구매 발주 커넥터"
    category: "전사적 자원 관리 (ERP)"
    source_type: "SAP_ODATA_OR_RFC"
    auth_type: "BASIC_AUTH_OR_OAUTH2_SAML"
    required_secret_keys:
      - "sap_base_url"
      - "sap_client_number"
      - "sap_api_username"
      - "sap_api_password"
    sync_mode: "DAILY_BATCH"
    acl_mode: "BUSINESS_PARTNER_AUTHORIZATION_OBJECTS"
    description: "SAP S/4HANA OData 서비스로부터 고객/공급업체 마스터, 자재 카탈로그, 구매 주문서(PO) 및 코스트센터 데이터를 색인한다."
    content_types:
      - "BusinessPartner"
      - "MaterialMaster"
      - "PurchaseOrder"
    default_scope: "ORG"

  - slug: "collab-slack-archive"
    name: "Slack Enterprise Grid 채널 대화 및 캔버스 커넥터"
    category: "사내 메신저 및 협업"
    source_type: "SLACK"
    auth_type: "SLACK_BOT_USER_OAUTH_TOKEN"
    required_secret_keys:
      - "slack_user_token"
      - "slack_bot_token"
      - "slack_signing_secret"
    sync_mode: "HOURLY_INCREMENTAL"
    acl_mode: "PRIVATE_CHANNEL_MEMBERSHIP_FILTER"
    description: "Slack Enterprise Grid 내 공개 및 지정 비공개 프로젝트 채널의 대화 이력, 스레드, 공유 캔버스 문서를 채널 멤버십 필터와 함께 색인한다."
    content_types:
      - "messages"
      - "threads"
      - "canvas_docs"
    default_scope: "ORG"

  - slug: "repo-github-docs"
    name: "GitHub Enterprise 기술 문서 및 RFC 커넥터"
    category: "소스 코드 및 기술 문서"
    source_type: "GITHUB"
    auth_type: "GITHUB_PERSONAL_ACCESS_TOKEN"
    required_secret_keys:
      - "github_org_name"
      - "github_pat_secret_id"
      - "github_repo_list"
    sync_mode: "HOURLY_INCREMENTAL"
    acl_mode: "REPO_COLLABORATOR_TEAMS"
    description: "사내 깃허브 저장소의 마크다운 문서(README.md, docs/, RFCs) 및 OpenAPI 스펙을 팀/조직 열람 권한에 연동하여 색인한다."
    content_types:
      - "markdown_docs"
      - "open_api_specs"
    default_scope: "ORG"

  - slug: "repo-gitlab-wiki"
    name: "GitLab Enterprise 위키 및 프로젝트 문서 커넥터"
    category: "소스 코드 및 기술 문서"
    source_type: "GITLAB"
    auth_type: "GITLAB_PROJECT_ACCESS_TOKEN"
    required_secret_keys:
      - "gitlab_instance_url"
      - "gitlab_pat_secret_id"
      - "gitlab_group_id"
    sync_mode: "HOURLY_INCREMENTAL"
    acl_mode: "GITLAB_PROJECT_MEMBERSHIP_ROLE"
    description: "GitLab 엔터프라이즈 프로젝트 위키, 이슈 보드 논의 내역, 설계 마크다운 문서를 프로젝트 멤버십 역할에 맞추어 색인한다."
    content_types:
      - "wiki_pages"
      - "project_docs"
      - "issue_notes"
    default_scope: "ORG"

  - slug: "support-zendesk-ticket"
    name: "Zendesk Support 헬프센터 및 고객 상담 커넥터"
    category: "고객 지원 및 서비스 (CS)"
    source_type: "ZENDESK"
    auth_type: "OAUTH2_OR_API_TOKEN"
    required_secret_keys:
      - "zendesk_subdomain"
      - "zendesk_agent_email"
      - "zendesk_api_token"
    sync_mode: "HOURLY_INCREMENTAL"
    acl_mode: "USER_SEGMENT_AND_BRAND_RESTRICTION"
    description: "Zendesk 헬프센터 공개/내부 기술 FAQ 기사, 해결된 상담 티켓 및 매크로 지식을 고객 세그먼트 및 브랜드 권한과 연동하여 색인한다."
    content_types:
      - "help_center_articles"
      - "resolved_tickets"
      - "macros"
    default_scope: "ORG"

  - slug: "collab-box-enterprise"
    name: "Box Enterprise 기업 콘텐츠 및 보안 폴더 커넥터"
    category: "엔터프라이즈 콘텐츠 관리"
    source_type: "BOX"
    auth_type: "OAUTH2_BOX_CCG_OR_JWT"
    required_secret_keys:
      - "box_enterprise_id"
      - "box_client_id"
      - "box_client_secret"
    sync_mode: "DAILY_BATCH"
    acl_mode: "BOX_FOLDER_COLLABORATION_ROLES"
    description: "Box Enterprise 내 기밀 프로젝트 폴더 및 대용량 규제 문서를 색인하고 사용자별 협업자(Collaborator) 권한을 동기화한다."
    content_types:
      - "documents"
      - "folder_trees"
      - "metadata_templates"
    default_scope: "ORG"

  - slug: "crm-hubspot-deal"
    name: "HubSpot CRM 고객 연락처 및 딜 파이프라인 커넥터"
    category: "고객 관계 관리 (CRM)"
    source_type: "HUBSPOT"
    auth_type: "OAUTH2_PRIVATE_APP_TOKEN"
    required_secret_keys:
      - "hubspot_portal_id"
      - "hubspot_access_token"
    sync_mode: "DAILY_BATCH"
    acl_mode: "TEAM_AND_OWNERSHIP_ASSIGNMENT"
    description: "HubSpot CRM 내 인바운드 마케팅 연락처, 회사 프로필, 딜 파이프라인 및 고객 커뮤니케이션 기록을 담당자/팀 소유권 권한에 맞추어 색인한다."
    content_types:
      - "contacts"
      - "companies"
      - "deals"
      - "engagements"
    default_scope: "ORG"

